<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uno Más · Partidos en tu barrio</title>
    <meta
      name="description"
      content="Uno Más: creá, encontrá y unite a partidos de fútbol, básquet, tenis y vóley en tu barrio."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c5cff'/%3E%3Cpath d='M16 7l1.9 5.9L24 15l-6.1 2.1L16 23l-1.9-5.9L8 15l6.1-2.1z' fill='%23081020'/%3E%3C/svg%3E"
    />
    <script>
      // Aplica el tema guardado antes del primer render para evitar parpadeos.
      try {
        var guardado = localStorage.getItem('unomas:tema:v1');
        if (guardado === 'claro' || guardado === 'oscuro') {
          document.documentElement.setAttribute('data-tema', guardado);
        }
      } catch (error) {
        /* Sin almacenamiento: se mantiene el tema por defecto. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
